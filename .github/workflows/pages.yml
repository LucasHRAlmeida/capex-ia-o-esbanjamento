# human-gate: true — deploy autorizado pelo Owner nesta execução
name: Publicar no GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Instalar e gerar o site
        working-directory: site
        run: npm ci && npm test && npm run build

      - name: Conferir sitemap no artefato
        run: |
          test -f site/dist/sitemap.xml
          test -f site/dist/robots.txt
          grep -q 'lastmod>2026-10-25' site/dist/sitemap.xml
          grep -q '?lang=en' site/dist/sitemap.xml
          grep -q '?lang=es' site/dist/sitemap.xml
          grep -q 'Sitemap: https://iniciativa-via.com/capex-ia-o-esbanjamento/sitemap.xml' site/dist/robots.txt

      # Pages já foi habilitado manualmente pelo Owner.
      # Não usar configure-pages: a integração conectada não possui permissão
      # administrativa para criar/consultar o site via API, embora o workflow
      # possua pages:write para publicar o artefato.
      - name: Enviar artefato
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
